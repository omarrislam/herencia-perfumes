<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HERENCIA — Luxury in every drop</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #241111; transition: opacity 0.45s ease;
      }
      #app-splash.splash-hide { opacity: 0; pointer-events: none; }
      #app-splash .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #app-splash img { width: 76px; height: 76px; animation: splashPulse 1.8s ease-in-out infinite; }
      #app-splash .splash-word {
        font-family: 'Cinzel', Georgia, serif; letter-spacing: 0.35em;
        color: #f4ead0; font-size: 15px; padding-left: 0.35em;
      }
      #app-splash .splash-bar {
        position: relative; width: 130px; height: 2px;
        background: rgba(207, 168, 98, 0.2); overflow: hidden; border-radius: 2px;
      }
      #app-splash .splash-bar span {
        position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, #cfa862, transparent);
        animation: splashSlide 1.3s linear infinite;
      }
      @keyframes splashPulse { 0%, 100% { opacity: 0.55; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes splashSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { #app-splash img, #app-splash .splash-bar span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="splash-inner">
        <img src="/logo.png" alt="HERENCIA" width="76" height="76" />
        <div class="splash-word">HERENCIA</div>
        <div class="splash-bar"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
